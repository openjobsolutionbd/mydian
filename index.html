<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mydian — My Notes</title>
  <meta name="description" content="Personal markdown notes app, synced to GitHub" />
  <meta name="theme-color" content="#151517" id="theme-color-meta" />
  <!-- CSS লোড হওয়ার আগেই থিম সেট করা হচ্ছে যাতে ভুল থিমে একমুহূর্তের
       জন্যও flash না দেখায় (dark ইউজার light-এ সংক্ষিপ্ত ঝলক দেখতেন,
       নাহলে)। localStorage না থাকলে (প্রথমবার) dark-ই থাকবে, ডিফল্ট। -->
  <script>
    (function () {
      var saved = localStorage.getItem("mydian-theme");
      if (saved === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ===== Login screen ===== -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-mark">M</div>
      <h1>Mydian</h1>
      <p class="login-sub">Enter your PIN to continue</p>
      <form id="login-form">
        <input type="password" id="pin-input" inputmode="numeric" autocomplete="off" placeholder="••••" autofocus />
        <button type="submit">Log In</button>
      </form>
      <p id="login-error" class="login-error" hidden></p>
    </div>
  </div>

  <!-- ===== Main app ===== -->
  <div id="app" class="app" hidden>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Mydian</span>
        <div class="sidebar-actions">
          <button class="icon-btn" id="btn-quick-switcher" title="Search files (Ctrl+K)" aria-label="Search files">
            <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-new-file" title="New file" aria-label="New file">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12v6M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-new-folder" title="New folder" aria-label="New folder">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v4M10 13h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-refresh" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 12a9 9 0 1 1-3-6.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M21 3v6h-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-7.54-7.54A9 9 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="sync-status" id="sync-status">
        <span class="sync-dot" id="sync-dot"></span>
        <span id="sync-text">Connecting…</span>
      </div>

      <nav class="file-tree" id="file-tree">
        <div class="tree-empty" id="tree-loading">Loading…</div>
      </nav>

      <div class="sidebar-footer">
        <button class="icon-btn" id="btn-settings" title="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="btn-menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="breadcrumb" id="breadcrumb">Select a file</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-attach" title="Add image/PDF" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-preview-toggle" title="Toggle preview/edit" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="icon-btn" id="btn-download" title="Download" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn danger" id="btn-delete" title="Delete" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="save-indicator" id="save-indicator"></span>
        </div>
      </header>

      <div class="editor-area" id="editor-area">
        <div class="empty-state" id="empty-state">
          <div class="empty-mark">M</div>
          <h2>Welcome to Mydian</h2>
          <p>Pick a file from the left, or create a new one.</p>
        </div>
        <div class="editor-wrap" id="editor-wrap" hidden>
          <h1 class="file-title" id="file-title"></h1>
          <div id="cm-editor" class="cm-host"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ===== Small modal (new file/folder/rename) ===== -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <h3 id="modal-title">New File</h3>
      <input type="text" id="modal-input" placeholder="Enter a name…" autocomplete="off" />
      <p class="modal-hint" id="modal-hint"></p>
      <div class="modal-actions">
        <button class="btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn-primary" id="modal-confirm">Create</button>
      </div>
    </div>
  </div>

  <!-- ===== Quick switcher (Ctrl/Cmd+K) — টাইপ করে ফাইল খোঁজা ও এক Enter-এ খোলা ===== -->
  <div class="modal-overlay" id="quick-switcher-overlay" hidden>
    <div class="modal quick-switcher">
      <input type="text" id="quick-switcher-input" placeholder="Type a file name…" autocomplete="off" />
      <div class="quick-switcher-results" id="quick-switcher-results"></div>
    </div>
  </div>

  <!-- ===== Settings modal ===== -->
  <div class="modal-overlay" id="settings-modal-overlay" hidden>
    <div class="modal">
      <h3>Settings</h3>
      <p class="modal-hint" id="settings-vault-info"></p>
      <p class="modal-hint">
        <button class="link-btn" id="settings-theme-toggle">🌙 Dark mode</button>
      </p>
      <p class="modal-hint">
        <button class="link-btn" id="settings-clear-cache">Clear Cache</button>
      </p>
      <p class="modal-hint">
        <button class="link-btn" id="settings-view-errors">View Error Log</button>
      </p>
      <div class="modal-actions">
        <button class="btn-ghost" id="settings-close">Close</button>
        <button class="btn-primary danger" id="settings-logout">Log Out</button>
      </div>
    </div>
  </div>

  <!-- ===== Error log viewer — opens from "View Error Log" in Settings ===== -->
  <div class="modal-overlay" id="error-log-overlay" hidden>
    <div class="modal error-log-modal">
      <h3>Error Log</h3>
      <p class="modal-hint">This list stays only in this browser — it's never sent anywhere.</p>
      <div class="error-log-list" id="error-log-list"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="error-log-clear">Clear Log</button>
        <button class="btn-primary" id="error-log-close">Close</button>
      </div>
    </div>
  </div>

  <!-- ===== Delete confirm modal (with PIN) ===== -->
  <div class="modal-overlay" id="delete-confirm-overlay" hidden>
    <div class="modal">
      <h3>Confirm Delete</h3>
      <p class="modal-hint" id="delete-confirm-message"></p>
      <form id="delete-confirm-form">
        <input type="password" id="delete-confirm-pin" inputmode="numeric" autocomplete="off" placeholder="Enter your PIN" />
      </form>
      <p class="login-error" id="delete-confirm-error" hidden></p>
      <div class="modal-actions">
        <button class="btn-ghost" id="delete-confirm-cancel">Cancel</button>
        <button class="btn-primary danger" id="delete-confirm-submit">Delete</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*,.pdf" hidden multiple />

  <script type="module" src="/app.js"></script>
</body>
</html>
