<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mydian — আমার নোট</title>
  <meta name="description" content="ব্যক্তিগত মার্কডাউন নোট অ্যাপ, GitHub-এ সিঙ্ক হয়" />
  <meta name="theme-color" content="#151517" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ===== লগইন স্ক্রিন ===== -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-mark">মি</div>
      <h1>Mydian</h1>
      <p class="login-sub">চালু করতে আপনার PIN দিন</p>
      <form id="login-form">
        <input type="password" id="pin-input" inputmode="numeric" autocomplete="off" placeholder="••••" autofocus />
        <button type="submit">প্রবেশ করুন</button>
      </form>
      <p id="login-error" class="login-error" hidden></p>
    </div>
  </div>

  <!-- ===== মূল অ্যাপ ===== -->
  <div id="app" class="app" hidden>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Mydian</span>
        <div class="sidebar-actions">
          <button class="icon-btn" id="btn-new-file" title="নতুন ফাইল" aria-label="নতুন ফাইল">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12v6M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-new-folder" title="নতুন ফোল্ডার" aria-label="নতুন ফোল্ডার">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v4M10 13h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-refresh" title="রিফ্রেশ" aria-label="রিফ্রেশ">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 12a9 9 0 1 1-3-6.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M21 3v6h-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="sync-status" id="sync-status">
        <span class="sync-dot" id="sync-dot"></span>
        <span id="sync-text">সংযুক্ত হচ্ছে…</span>
      </div>

      <nav class="file-tree" id="file-tree">
        <div class="tree-empty" id="tree-loading">লোড হচ্ছে…</div>
      </nav>

      <div class="sidebar-footer">
        <button class="icon-btn" id="btn-settings" title="সেটিংস">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>সেটিংস</span>
        </button>
      </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="btn-menu" aria-label="মেনু">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="breadcrumb" id="breadcrumb">একটি ফাইল বেছে নিন</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-attach" title="ছবি/PDF যোগ করুন" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-preview-toggle" title="প্রিভিউ/এডিট টগল" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="icon-btn" id="btn-download" title="ডাউনলোড" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn danger" id="btn-delete" title="ডিলিট করুন" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="save-indicator" id="save-indicator"></span>
        </div>
      </header>

      <div class="editor-area" id="editor-area">
        <div class="empty-state" id="empty-state">
          <div class="empty-mark">মি</div>
          <h2>স্বাগতম, Mydian-এ</h2>
          <p>বামপাশ থেকে একটা ফাইল বেছে নিন, অথবা নতুন ফাইল তৈরি করুন।</p>
        </div>
        <div class="editor-wrap" id="editor-wrap" hidden>
          <div id="cm-editor" class="cm-host"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ===== ছোট মোডাল (নতুন ফাইল/ফোল্ডার/রিনেম) ===== -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <h3 id="modal-title">নতুন ফাইল</h3>
      <input type="text" id="modal-input" placeholder="নাম লিখুন…" autocomplete="off" />
      <p class="modal-hint" id="modal-hint"></p>
      <div class="modal-actions">
        <button class="btn-ghost" id="modal-cancel">বাতিল</button>
        <button class="btn-primary" id="modal-confirm">তৈরি করুন</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*,.pdf" hidden multiple />

  <script type="module" src="/app.js"></script>
</body>
</html>
